<!doctype html>
<html lang="en-PK">
  <head>
    <meta charset="UTF-8" />
    <!-- Google and most crawlers request /favicon.ico first; a real file must
         exist there or the SPA catch-all answers with HTML. 48px is the size
         Google recommends (multiples of 48). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1614" />

    <!--
      Defaults only. Every page overwrites the title, description, canonical and
      social tags at runtime via src/lib/seo.ts — these are what a crawler sees
      before the app has booted.
    -->
    <title>BM Collection — Pakistan&apos;s No.1 Online Jewellery &amp; Clothing Store</title>
    <meta
      name="description"
      content="Shop jewellery, clothing, bags &amp; accessories online at BM Collection — Pakistan's No.1 online store. Cash on delivery, free delivery over Rs 5,000."
    />
    <meta property="og:site_name" content="BM Collection" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_PK" />
    <meta property="og:title" content="BM Collection — Pakistan&apos;s No.1 Online Jewellery &amp; Clothing Store" />
    <meta
      property="og:description"
      content="Shop jewellery, clothing, bags &amp; accessories online at BM Collection — Pakistan's No.1 online store. Cash on delivery, free delivery over Rs 5,000."
    />
    <meta property="og:image" content="https://bmcollections.com/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Product images and fonts come from these origins; warm the connections early. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

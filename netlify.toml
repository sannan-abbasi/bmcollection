[build]
command = "npm run build"
publish = "dist"

# Netlify reads build-time variables from [build.environment].
#
# This file previously used an [env] / [env.production] block, which Netlify
# does not recognise — nothing in it was ever applied. The Supabase values are
# configured in the Netlify dashboard (Site settings → Environment variables),
# which is why the site worked despite that block containing a typo'd project
# URL. They are deliberately not repeated here so there is one source of truth.
[build.environment]
  # Enables canonical URLs and sitemap.xml generation at build time.
  VITE_SITE_URL = "https://bmcollections.com"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
